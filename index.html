  <style>

        navIndexList.appendChild(item);
      });
    }
    function renderSlide() {
      slideContent.style.opacity = "0";

        btnNext.disabled = currentSlide === slides.length - 1;
        buildIndex();
      }, 120);
    }
    function goToSlide(index) { if (index >= 0 && index < slides.length) { currentSlide = index; renderSlide(); } }
    btnPrev.addEventListener("click", () => goToSlide(currentSlide - 1));
    btnNext.addEventListener("click", () => goToSlide(currentSlide + 1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { if (currentSlide < slides.length - 1) goToSlide(currentSlide + 1); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { if (currentSlide > 0) goToSlide(currentSlide - 1); }
    });
    function openDrawer() { drawerNav.classList.remove("drawer-hidden"); drawerNav.classList.add("drawer-active"); drawerOverlay.classList.remove("opacity-0", "pointer-events-none"); drawerOverlay.classList.add("opacity-100"); }
